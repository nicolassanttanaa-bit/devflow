<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>devflow — Criar conta</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="screen">

    <section class="terminal-panel" aria-hidden="true">
      <div class="terminal-window">
        <div class="terminal-bar">
          <span class="dot dot-rose"></span>
          <span class="dot dot-amber"></span>
          <span class="dot dot-teal"></span>
          <span class="terminal-title">setup.log</span>
        </div>
        <div class="terminal-body" id="terminalBody"></div>
      </div>

      <div class="branch-graph">
        <svg viewBox="0 0 240 120" width="240" height="120" fill="none">
          <path d="M20 100 V60 C20 45 30 45 45 45 H90" stroke="#2A3345" stroke-width="2"/>
          <path d="M45 100 V70 C45 60 55 60 65 60 H90" stroke="#2A3345" stroke-width="2"/>
          <path d="M90 45 H220" stroke="#4FD1C5" stroke-width="2"/>
          <path d="M90 60 H150" stroke="#2A3345" stroke-width="2"/>
          <circle cx="20" cy="100" r="5" fill="#8B93A7"/>
          <circle cx="45" cy="100" r="5" fill="#8B93A7"/>
          <circle cx="90" cy="45" r="5" fill="#4FD1C5"/>
          <circle cx="90" cy="60" r="5" fill="#8B93A7"/>
          <circle cx="150" cy="60" r="5" fill="#8B93A7"/>
          <circle cx="220" cy="45" r="6" fill="#E8A33D"/>
        </svg>
        <span class="branch-label">novo branch → main</span>
      </div>
    </section>

    <section class="auth-panel">
      <div class="auth-card">

        <div class="brand">
          <span class="brand-prompt">&gt;_</span>
          <span class="brand-name">devflow</span>
        </div>

        <h1 class="auth-title">Criar conta</h1>
        <p class="auth-subtitle">Configure seu acesso ao workflow.</p>

        <form id="registerForm" novalidate>
          <div class="field">
            <label for="email">e-mail</label>
            <input type="email" id="email" name="email" placeholder="voce@exemplo.com" autocomplete="username" required>
            <span class="field-error" id="emailError"></span>
          </div>

          <div class="field">
            <label for="password">senha</label>
            <div class="password-wrap">
              <input type="password" id="password" name="password" placeholder="mínimo 6 caracteres" autocomplete="new-password" required>
              <button type="button" class="toggle-visibility" id="toggleVisibility" aria-label="Mostrar senha">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                  <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
              </button>
            </div>
            <span class="field-error" id="passwordError"></span>
          </div>

          <div class="field">
            <label for="confirmPassword">confirmar senha</label>
            <input type="password" id="confirmPassword" name="confirmPassword" placeholder="repita a senha" autocomplete="new-password" required>
            <span class="field-error" id="confirmError"></span>
          </div>

          <button type="submit" class="submit-btn" id="submitBtn" style="margin-top: 8px;">
            <span class="submit-label">criar conta</span>
            <span class="submit-log" id="submitLog"></span>
          </button>
        </form>

        <p class="auth-footer">
          já tem conta? <a href="index.html" class="link-accent">entrar</a>
        </p>

      </div>
    </section>

  </div>

  <script src="register.js"></script>
</body>
</html>
